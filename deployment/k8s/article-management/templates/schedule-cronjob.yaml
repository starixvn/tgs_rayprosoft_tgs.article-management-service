apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "article-management.fullname" . }}-scheduler
spec:
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  schedule: '{{ .Values.schedule.cron }}'
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: scheduler
              image: alpine/curl:8.4.0
              imagePullPolicy: IfNotPresent
              command:
                - |
                  curl -X POST http://{{ include "article-management.fullname" . }}/schedule/publish &&
                  curl -X POST http://{{ include "article-management.fullname" . }}/schedule/expired-draft
